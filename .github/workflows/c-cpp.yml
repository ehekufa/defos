name: Build and validate DefOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: defos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate extension package
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate extension source
        run: |
          set -euxo pipefail

          # Core project files
          test -f README.md
          test -f LICENSE
          test -f game.project

          # Extension manifest and settings
          test -f defos/ext.manifest
          test -f defos/ext.properties

          # Defold API glue
          test -f defos/api/defos.lua
          test -f defos/api/defos.script_api

          # Native extension sources
          test -f defos/src/defos.cpp
          test -f defos/src/defos_linux.cpp
          test -f defos/src/defos_mac.mm
          test -f defos/src/defos_win.cpp
          test -f defos/src/defos_html5.cpp
          test -f defos/src/defos_private.h

          # Bundled static libraries
          test -f defos/lib/x86_64-linux/libXcursor.a
          test -f defos/lib/x86_64-linux/libXrandr.a
          test -f defos/lib/arm64-linux/libXcursor.a
          test -f defos/lib/arm64-linux/libXrandr.a

      - name: Create source package
        run: |
          set -euxo pipefail
          mkdir -p dist
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./dist' \
            -czf "dist/defos-${{ github.sha }}.tar.gz" .

      - name: Upload DefOS package
        uses: actions/upload-artifact@v6
        with:
          name: DefOS-${{ github.sha }}
          path: dist/defos-*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
